name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase-0-1-foundation
      - phase-3-auth
      - phase-4-onboarding

jobs:
  web:
    name: Web quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Auth route tests
        run: npm run test:auth

      - name: Build
        run: npm run build
