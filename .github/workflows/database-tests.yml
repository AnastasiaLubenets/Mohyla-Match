name: Database Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - phase-0-1-foundation
      - phase-3-auth
      - phase-4-onboarding
      - phase-5-profiles

permissions:
  contents: read
  packages: read

jobs:
  database:
    name: Supabase migrations, seed, pgTAP, and advisors
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start local Supabase stack
        shell: bash
        run: |
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          supabase start

      - name: Export local Supabase environment
        shell: bash
        run: |
          supabase status -o env > supabase.env
          source supabase.env
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "LOCAL_SUPABASE_DB_URL=${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" >> "$GITHUB_ENV"
          echo "APP_BASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - name: Recreate database from migrations and seed
        run: supabase db reset

      - name: Run pgTAP database tests
        shell: bash
        run: |
          psql "$LOCAL_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap with schema public;"

          run_pgtap() {
            local test_file="$1"
            local label="$2"
            local output
            output="$(mktemp)"

            echo "::group::${label}"
            if ! psql "$LOCAL_SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -A -t -f "$test_file" | tee "$output"; then
              echo "::error file=${test_file}::SQL execution failed for ${label}"
              echo "::endgroup::"
              rm -f "$output"
              return 1
            fi

            if grep -E '^(not ok|# Looks like you)' "$output"; then
              echo "::error file=${test_file}::pgTAP failed for ${label}"
              echo "::endgroup::"
              rm -f "$output"
              return 1
            fi

            echo "::endgroup::"
            rm -f "$output"
          }

          run_pgtap supabase/tests/phase2_security_test.sql "phase 2 security pgTAP tests"
          run_pgtap supabase/tests/phase3_auth_hook_test.sql "phase 3 auth hook pgTAP tests"
          run_pgtap supabase/tests/phase4_onboarding_test.sql "phase 4 onboarding pgTAP tests"
          run_pgtap supabase/tests/phase5_profiles_test.sql "phase 5 profile pgTAP tests"
          run_pgtap supabase/tests/phase6_matching_test.sql "phase 6 matching pgTAP tests"
          run_pgtap supabase/tests/phase6_1_direct_contact_saved_test.sql "phase 6.1 direct contact and saved pgTAP tests"
          run_pgtap supabase/tests/phase7_discovery_views_test.sql "phase 7 discovery views pgTAP tests"
          run_pgtap supabase/tests/production_taxonomy_test.sql "production taxonomy pgTAP tests"
          run_pgtap supabase/tests/production_onboarding_reference_taxonomy_test.sql "onboarding reference taxonomy pgTAP tests"
          run_pgtap supabase/tests/profile_deletion_test.sql "profile deletion pgTAP tests"

      - name: Run Supabase database advisors
        run: supabase db advisors --local --type all --level warn --fail-on error

      - name: Build app for auth integration
        run: npm run build

      - name: Run auth and profile integration tests
        shell: bash
        run: |
          npm run start -- -p 3000 > next-auth.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID"' EXIT
          for attempt in {1..60}; do
            if curl -sf http://127.0.0.1:3000/login > /dev/null; then
              npm run test:auth:integration
              exit 0
            fi
            sleep 1
          done
          cat next-auth.log
          exit 1
