name: Database Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - phase-0-1-foundation
      - phase-3-auth
      - phase-4-onboarding
      - phase-5-profiles

jobs:
  database:
    name: Supabase migrations, seed, pgTAP, and advisors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws/supabase

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start local Supabase database
        run: supabase db start

      - name: Recreate database from migrations and seed
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Run Supabase database advisors
        run: supabase db advisors --local --type all --level warn --fail-on error
